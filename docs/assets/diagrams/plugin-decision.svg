<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" width="820" height="260" role="img" aria-label="ainb vs Claude Code plugin decision tree">
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;}@media (prefers-color-scheme: dark){.bg{fill:#0F0F18;}.ink{fill:#DCDCE6;}.mute{fill:#9A9AB0;}.accent{fill:#E08A63;}.accentfill{fill:#E08A63;}.card{fill:#191923;stroke:#2E2E3E;}.chip{fill:#20202C;stroke:#2E2E3E;}.line{stroke:#7A7A92;}.alt{stroke:#8FA86B;}.linefill{fill:#7A7A92;}.altfill{fill:#8FA86B;}}</style>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="8" refX="7.5" refY="4" orient="auto"><polygon points="0 0, 8.5 4, 0 8" class="linefill" fill="#8A857C"/></marker>
    <marker id="arrAlt" markerWidth="9" markerHeight="8" refX="7.5" refY="4" orient="auto"><polygon points="0 0, 8.5 4, 0 8" class="altfill" fill="#5F7048"/></marker>
  </defs>
  <rect width="820" height="260" class="bg" fill="#FAF9F5"/>
  <text x="36" y="34" font-size="18" class="ink" fill="#141413" text-anchor="start" font-weight="800">Plugin Extension Decision Tree</text>
  <rect x="36" y="42" width="220" height="3" rx="1.5" class="accentfill" fill="#C25A38"/>
  <text x="271" y="34" font-size="11.5" class="mute" fill="#6B655B" text-anchor="start">disambiguating ainb TUI plugins vs Claude Code plugins</text>
  <rect x="240" y="58" width="340" height="42" rx="10" class="card" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="1"/>
  <text x="410" y="84" font-size="12.5" class="ink" fill="#141413" text-anchor="middle" font-weight="700">Are you trying to extend... ?</text>
  <path d="M290 100 L216 126" class="line" fill="none" stroke="#8A857C" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M530 100 L604 126" class="alt" fill="none" stroke="#5F7048" stroke-width="1.6" marker-end="url(#arrAlt)"/>
  <rect x="36" y="130" width="360" height="110" rx="10" class="card" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="1"/>
  <rect x="36" y="130" width="3" height="110" rx="1.5" class="accentfill" fill="#C25A38"/>
  <text x="50" y="154" font-size="13" class="ink" fill="#141413" text-anchor="start" font-weight="700">The ainb Terminal UI</text>
  <text x="50" y="174" font-size="11" class="accent" fill="#C25A38" text-anchor="start" font-weight="600">ainb v2 native executable plugin</text>
  <text x="50" y="198" font-size="10.5" class="mute" fill="#6B655B" text-anchor="start">Communicates over framed JSON-RPC stdio</text>
  <text x="50" y="218" font-size="10.5" class="mute" fill="#6B655B" text-anchor="start">Guide: /plugins/authoring</text>
  <rect x="424" y="130" width="360" height="110" rx="10" class="card" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="1"/>
  <rect x="424" y="130" width="3" height="110" rx="1.5" class="altfill" fill="#5F7048"/>
  <text x="438" y="154" font-size="13" class="ink" fill="#141413" text-anchor="start" font-weight="700">Claude Code CLI or Desktop</text>
  <text x="438" y="174" font-size="11" class="alt" fill="#5F7048" text-anchor="start" font-weight="600">Claude Code plugin (hooks &amp; slash commands)</text>
  <text x="438" y="198" font-size="10.5" class="mute" fill="#6B655B" text-anchor="start">Examples: plugins/ainb-fleet, ainb-hooks, reflect</text>
  <text x="438" y="218" font-size="10.5" class="mute" fill="#6B655B" text-anchor="start">Reference: upstream Anthropic plugin docs</text>
</svg>
