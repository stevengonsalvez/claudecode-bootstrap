<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" role="img" aria-label="ainb observability architecture: local TUI plugins and remote OpenTelemetry Grafana pipeline">
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;}@media (prefers-color-scheme: dark){.bg{fill:#0F0F18;}.ink{fill:#DCDCE6;}.mute{fill:#9A9AB0;}.accent{fill:#E08A63;}.accentfill{fill:#E08A63;}.card{fill:#191923;stroke:#2E2E3E;}.chip{fill:#20202C;stroke:#2E2E3E;}.line{stroke:#7A7A92;}.alt{stroke:#8FA86B;}.linefill{fill:#7A7A92;}.altfill{fill:#8FA86B;}}</style>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="8" refX="7.5" refY="4" orient="auto"><polygon points="0 0, 8.5 4, 0 8" class="linefill" fill="#8A857C"/></marker>
    <marker id="arrAlt" markerWidth="9" markerHeight="8" refX="7.5" refY="4" orient="auto"><polygon points="0 0, 8.5 4, 0 8" class="altfill" fill="#5F7048"/></marker>
  </defs>
  <rect width="880" height="240" class="bg" fill="#FAF9F5"/>
  <text x="36" y="36" font-size="18" class="ink" fill="#141413" text-anchor="start" font-weight="800">ainb Observability Architecture</text>
  <rect x="36" y="44" width="220" height="3" rx="1.5" class="accentfill" fill="#C25A38"/>
  <text x="271" y="36" font-size="11.5" class="mute" fill="#6B655B" text-anchor="start">zero-config local runtime analytics paired with off-box historical tracing</text>
  <rect x="36" y="66" width="390" height="135" rx="10" class="card" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="1"/>
  <rect x="36" y="66" width="3" height="135" rx="1.5" class="accentfill" fill="#C25A38"/>
  <text x="50" y="90" font-size="13" class="ink" fill="#141413" text-anchor="start" font-weight="700">Local, in-the-moment (TUI views)</text>
  <text x="50" y="110" font-size="11" class="accent" fill="#C25A38" text-anchor="start" font-weight="600">zero configuration required: inspect right now</text>
  <text x="50" y="136" font-size="11" class="mute" fill="#6B655B" text-anchor="start">burndown: live session token usage &amp; cost burn</text>
  <text x="50" y="156" font-size="11" class="mute" fill="#6B655B" text-anchor="start">abtop: live agent processes, CPU%, RSS, and status</text>
  <text x="50" y="176" font-size="11" class="mute" fill="#6B655B" text-anchor="start">witr: command causality, blast radius, and lineage</text>
  <rect x="454" y="66" width="390" height="135" rx="10" class="card" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="1"/>
  <rect x="454" y="66" width="3" height="135" rx="1.5" class="altfill" fill="#5F7048"/>
  <text x="468" y="90" font-size="13" class="ink" fill="#141413" text-anchor="start" font-weight="700">Remote, historical (OTEL + Grafana)</text>
  <text x="468" y="110" font-size="11" class="alt" fill="#5F7048" text-anchor="start" font-weight="600">persisted telemetry: trend analysis &amp; auditing</text>
  <text x="468" y="136" font-size="11" class="mute" fill="#6B655B" text-anchor="start">Grafana Alloy: local tmux collector (:4317/:4318)</text>
  <text x="468" y="156" font-size="11" class="mute" fill="#6B655B" text-anchor="start">Grafana Cloud: dashboards, cost rollups, latency p95</text>
  <text x="468" y="176" font-size="11" class="mute" fill="#6B655B" text-anchor="start">Traces &amp; audit: tool calls, prompt tokens, agent runs</text>
  <text x="36" y="220" font-size="11.5" class="mute" fill="#6B655B" text-anchor="start">TUI plugins provide immediate answers; OTLP shipping persists across sessions.</text>
</svg>
